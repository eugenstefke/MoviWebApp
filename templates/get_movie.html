{% extends "base.html" %}
{% block content %}
<h1>Your Movie library</h1>
<form action="{{ url_for('add_movie', user_id=user_id) }}" method="post">

<ul>
    {% for movie in movies %}
    <li>
        <h3>{{ movie.title }}</h3>
        <h3>{{ movie.publication_year }}</h3>
        <img src={{ movie.poster_url }} title={{ movie.title}}/>
    </li>
    {% endfor %}
</ul>
    <input type="submit" value="Add a new Movie">
</form>
{% endblock %}
