{% extends "base.html" %}
{% block content %}
<h2>Users</h2>
<ul>
    {% for user in users %}
    <li>
        <h3>{{ user.name }}</h3>
        <h3><a href="{{ url_for('get_movies', user_id=user.id) }}" >View Movies</a></h3>
    </li>
    {% endfor %}

</ul>
<form action="/users" method="POST">
<h3>Creat new User</h3>
<div>
            <label for="name"></label>
            <input type="text" id="name" name="name" placeholder="User name" required>
    <button type="submit">Add User</button>
          </div>
</form>
{% endblock %}
