{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<form action="{{ url_for('create_user') }}" method="post">


<ul>
    {% for user in users %}
    <li>
        <h3><a href="{{ url_for('get_movies', user_id=user.id) }}" >{{ user.name }}</a></h3>
    </li>
    {% endfor %}

</ul>
    <input type="submit" value="Creat a new User">
</form>
{% endblock %}
