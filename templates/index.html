{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<ul>
    {% for user in users %}
    <li>
        <h3><a href="{{ url_for('get_movies', user_id=user.id) }}" >{{ user.name }}</a></h3>
    </li>
    {% endfor %}

</ul>
<form action="/users" method="POST">
<h3>Creat a new User</h3>
<div>
            <label for="name"></label>
            <input type="text" id="name" name="name" value="Username" required>
    <button type="submit">Add User</button>
          </div>
</form>
{% endblock %}
